            ].map(source => `
              <li class="p-3 bg-surface-container-low rounded-lg flex items-center justify-between gap-3">
                <span class="font-body-sm text-body-sm text-on-surface truncate">${source.t}</span>
                <span class="px-2 py-0.5 rounded font-label-sm text-label-sm shrink-0 whitespace-nowrap ${source.direct ? 'bg-secondary-fixed text-on-secondary-fixed' : 'bg-surface-variant text-on-surface-variant'}">
                  ${source.tag}
                </span>
              </li>
            `).join('')}
          </ul>
        `
      }
    };

    function openDrawer(key) {
      const data = drawerData[key];
      if (!data) return;

      document.getElementById('drawer-title').textContent = data.title;
      document.getElementById('drawer-badge').textContent = data.badge;
      document.getElementById('drawer-icon').textContent = data.icon;
      document.getElementById('drawer-content').innerHTML = data.render();

      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('side-drawer');

      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      backdrop.classList.add('opacity-100');

      drawer.classList.remove('translate-x-full');
      drawer.classList.add('translate-x-0');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      const backdrop = document.getElementById('drawer-backdrop');
      const drawer = document.getElementById('side-drawer');

      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0', 'pointer-events-none');

      drawer.classList.remove('translate-x-0');
      drawer.classList.add('translate-x-full');
      document.body.style.overflow = '';
    }

    // Set active nav link style dynamically on page load
    document.addEventListener('DOMContentLoaded', () => {
      const navLinks = document.querySelectorAll('header nav a');
      navLinks.forEach(link => {
        if (link.getAttribute('data-path') === 'sumber') {
          link.classList.remove('border-transparent', 'text-on-surface-variant');
          link.classList.add('border-b-2', 'border-primary-container', 'text-primary-container', 'font-semibold');
        }
      });
    });
  </script>
